name: test

# Builds everything, anton-gui included, runs the self-checks and draws
# anton-gui's screens on the demo, on every PR; required to merge. Linux only:
# the checks are pure logic, and the macOS build is exercised by release.yml.
#
# No `paths:` filter on the trigger. A workflow skipped that way never reports,
# so a required check would block a docs-only PR forever. Instead the workflow
# always starts and `build-and-test` is skipped when no code changed -- a
# skipped job counts as passing for required checks.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

# A new push to the PR makes the previous run pointless.
concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh pr diff ${{ github.event.pull_request.number }} \
            --repo "$GITHUB_REPOSITORY" --name-only)
          if printf '%s\n' "$files" \
              | grep -qE '^(src/|plugins/|tests/|cmake/|assets/|docs/demo/|CMakeLists\.txt$|\.github/workflows/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04  # same image as the release build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # anton-gui's window comes from GLFW, which builds against the X11
      # headers; xvfb and Mesa's software GL run it below with no display.
      - name: Install the GUI's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorg-dev libgl1-mesa-dev xvfb libgl1-mesa-dri

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - name: Self-checks
        run: ctest --test-dir build --output-on-failure

      # anton-gui on the demo (fake gh, fake plugins, no network), offscreen:
      # it must start, load the data, draw each screen and write a PNG.
      - name: anton-gui screenshots on the demo
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p shots
          for screen in list reader settings palette; do
            echo "== $screen"
            args="--screenshot shots/$screen.png --screen $screen --pr 4812 --file specs/onboarding.md --palette-query temoc"
            xvfb-run -a -s "-screen 0 1600x1000x24" env ANTON=build/anton-gui ./docs/demo/run.sh $args || {
              # it crashed: the same run again under AddressSanitizer, for where and why
              cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address
              cmake --build build-asan -j --target anton-gui
              sudo apt-get install -y --no-install-recommends llvm  # llvm-symbolizer: inlined frames too
              xvfb-run -a -s "-screen 0 1600x1000x24" env ANTON=build-asan/anton-gui \
                ASAN_SYMBOLIZER_PATH=/usr/bin/llvm-symbolizer ./docs/demo/run.sh $args
              exit 1
            }
            test -s "shots/$screen.png"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anton-gui-screenshots-linux
          path: shots/
          retention-days: 7
