# Every PR: build and test on Linux and macOS.
# Every merge to main: the same, then a release if VERSION in CMakeLists.txt
# has no release yet. Releasing = bumping that version in a PR.
name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x86_64 }
          - { os: macos-latest, target: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - run: tar -czf anton-${{ matrix.target }}.tar.gz -C build anton anton-slkx
      - uses: actions/upload-artifact@v4
        with:
          name: anton-${{ matrix.target }}
          path: anton-${{ matrix.target }}.tar.gz

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(sed -n 's/^project(anton VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          [ "$tag" != v ] || { echo "no VERSION in CMakeLists.txt"; exit 1; }
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released; bump VERSION in CMakeLists.txt to release again"
            exit 0
          fi
          gh release create "$tag" dist/*.tar.gz --title "$tag" --generate-notes --target "$GITHUB_SHA"
